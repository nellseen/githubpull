<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sample-vercel — Vercel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #000;
      color: #ededed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .card {
      background: #111;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .badge {
      display: inline-block;
      background: #1a1a1a;
      border: 1px solid #444;
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.8rem;
      color: #0070f3;
      font-weight: 600;
      margin-bottom: 1.25rem;
    }
    h1 { font-size: 1.85rem; font-weight: 700; margin-bottom: 0.75rem; letter-spacing: -0.02em; }
    p { color: #888; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem; }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #00e599;
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(0, 229, 153, 0.1);
      border: 1px solid rgba(0, 229, 153, 0.2);
      padding: 6px 14px;
      border-radius: 999px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #00e599; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">▲ Vercel Live Deployment</div>
    <h1>sample-vercel</h1>
    <p>Halaman ini berhasil di-deploy ke Vercel via Telegram Bot Multi-Cloud Deployer.</p>
    <div class="status-pill">
      <span class="dot"></span>
      <span>Deployment Status: Production Ready</span>
    </div>
  </div>
</body>
</html>
